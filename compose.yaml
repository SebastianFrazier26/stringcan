services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stringcan
      POSTGRES_PASSWORD: stringcan
      POSTGRES_DB: stringcan
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stringcan"]
      interval: 5s
      retries: 10
